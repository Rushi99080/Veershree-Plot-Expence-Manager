<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Manager</title>
<meta name="theme-color" content="#141A1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Site Manager">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141A1F;
  --ink-2:#39454F;
  --steel:#6B7A87;
  --line:#D6DDE3;
  --line-2:#EBEFF2;
  --bg:#EDF1F4;
  --surface:#FFFFFF;
  --hivis:#F5B301;
  --hivis-dk:#C08D00;
  --paid:#15784B;
  --paid-bg:#E3F3EA;
  --due:#C0392B;
  --due-bg:#FBE9E7;
  --rent:#2C5F8A;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.45;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Barlow Condensed','Barlow',sans-serif;margin:0;font-weight:700;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
button{cursor:pointer}
a{color:var(--rent)}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;
  padding:calc(8px + env(safe-area-inset-top)) 12px 0;
}
.tb-row{display:flex;align-items:center;gap:8px;padding-bottom:8px}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;letter-spacing:.02em;line-height:1;flex:0 0 auto}
.brand span{display:block;font-size:10.5px;font-family:'Barlow',sans-serif;font-weight:500;color:#93A3AF;letter-spacing:.08em;margin-top:2px}
.sitepick{
  flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px;justify-content:flex-end;
  background:#222C34;border:1px solid #33414B;border-radius:8px;padding:7px 10px;color:#fff;
}
.sitepick b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.sitepick i{font-style:normal;color:var(--hivis);font-size:11px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;background:none;border:0;color:#93A3AF;padding:9px 11px 10px;
  font-size:13.5px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;
}
.tab.on{color:#fff;border-bottom-color:var(--hivis)}

/* ---------- layout ---------- */
main{padding:12px 12px 24px;max-width:820px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.card>h3{
  padding:10px 12px;font-size:15px;border-bottom:1px solid var(--line-2);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.card>h3 small{font-family:'Barlow',sans-serif;font-weight:500;font-size:12px;color:var(--steel)}
.pad{padding:12px}
.muted{color:var(--steel);font-size:13px}
.tiny{font-size:12px;color:var(--steel)}
.right{text-align:right}
.center{text-align:center}
.mt{margin-top:12px}

/* ---------- hero totals ---------- */
.hero{background:var(--ink);color:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px}
.hero .lbl{font-size:11px;letter-spacing:.1em;color:#93A3AF;font-weight:600}
.hero .big{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:700;line-height:1.05;margin-top:2px}
.hero .big small{font-size:20px;color:var(--hivis);margin-right:4px;font-weight:600}
.hsplit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:#33414B;border-radius:8px;overflow:hidden;margin-top:12px}
.hsplit div{background:#1C242B;padding:9px 10px}
.hsplit .k{font-size:10.5px;color:#93A3AF;font-weight:600;letter-spacing:.04em}
.hsplit .v{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;margin-top:1px}
.pendbar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;background:var(--hivis);color:#241C00;border-radius:8px;padding:9px 12px}
.pendbar b{font-family:'Barlow Condensed',sans-serif;font-size:22px}

/* ---------- kpi grid ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px}
.kpi .k{font-size:11px;color:var(--steel);font-weight:600;letter-spacing:.03em}
.kpi .v{font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:700;margin-top:2px;line-height:1.1}
.kpi.g .v{color:var(--paid)} .kpi.r .v{color:var(--due)} .kpi.b .v{color:var(--rent)}
.k3{grid-template-columns:1fr 1fr 1fr}

/* ---------- tables ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;font-weight:600;font-size:11px;letter-spacing:.04em;color:var(--steel);
  padding:7px 10px;border-bottom:1px solid var(--line);background:#F7F9FA;white-space:nowrap;
}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;background:#F7F9FA;border-top:1px solid var(--line)}
.nowrap{white-space:nowrap}

/* ---------- log rows ---------- */
.row{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .ttl{font-weight:600;font-size:14.5px;word-break:break-word}
.row .sub{font-size:12px;color:var(--steel);margin-top:2px}
.row .amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:.03em}
.pill.p{background:var(--paid-bg);color:var(--paid)}
.pill.u{background:var(--due-bg);color:var(--due)}
.pill.n{background:#EEF2F5;color:var(--ink-2)}
.rowbtn{background:none;border:0;padding:6px 2px 0;color:var(--steel);font-size:12px;font-weight:600}

/* ---------- forms ---------- */
.field{margin-bottom:10px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.03em;margin-bottom:3px}
.field input,.field select,.field textarea{
  width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--hivis);outline-offset:-1px;border-color:var(--hivis)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
  padding:12px;border-radius:9px;border:0;background:var(--hivis);color:#241C00;font-weight:700;font-size:15px;
}
.btn:active{background:var(--hivis-dk)}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.dk{background:var(--ink);color:#fff}
.btn.dgr{background:#fff;border:1px solid #E7B7B1;color:var(--due)}
.btn.sm{width:auto;padding:8px 12px;font-size:13.5px}
.btnrow{display:flex;gap:8px;margin-top:4px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:#fff;padding:10px 6px;font-size:13.5px;font-weight:600;color:var(--steel)}
.seg button.on{background:var(--ink);color:#fff}
.seg.pu button.on[data-v="Paid"]{background:var(--paid)}
.seg.pu button.on[data-v="Unpaid"]{background:var(--due)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line-2);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
.nav button{background:none;border:0;padding:8px 2px 9px;color:var(--steel);font-size:10.5px;font-weight:600;line-height:1.2}
.nav button svg{display:block;margin:0 auto 2px;width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--ink)}
.nav button.on svg{stroke:var(--hivis-dk)}

/* ---------- sheet / modal ---------- */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(15,20,25,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{
  background:var(--bg);width:100%;max-width:820px;max-height:92vh;overflow-y:auto;
  border-radius:16px 16px 0 0;padding:14px 12px calc(20px + env(safe-area-inset-bottom));
}
.sheet h3{font-size:18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--steel);padding:0 4px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:90;
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:600;
  box-shadow:0 6px 20px rgba(15,20,25,.3);
}
.empty{padding:26px 16px;text-align:center;color:var(--steel);font-size:13.5px}
.warn{background:#FFF8E1;border:1px solid #F0D48A;color:#6B5300;padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
.bar{height:5px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--rent)}
@media (min-width:640px){ .kpis{grid-template-columns:repeat(4,1fr)} .k3{grid-template-columns:repeat(3,1fr)} }
@media (prefers-reduced-motion:no-preference){ .sheet .box{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px)}} }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
/* ============================================================
   STORAGE  —  data kadhich jau naye yasathi
   Claude madhe chalvla tar Claude chi storage, website var chalvla
   tar phone madhli IndexedDB (+ localStorage backup + rojche snapshots)
   ============================================================ */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const rq = indexedDB.open('vsms', 1);
      rq.onupgradeneeded = () => { rq.result.createObjectStore('kv'); };
      rq.onsuccess = () => { this.db = rq.result; res(this.db); };
      rq.onerror = () => rej(rq.error);
    });
  },
  async tx(mode) { const db = await this.open(); return db.transaction('kv', mode).objectStore('kv'); },
  async get(k) { const s = await this.tx('readonly'); return new Promise((res, rej) => { const r = s.get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async set(k, v) { const s = await this.tx('readwrite'); return new Promise((res, rej) => { const r = s.put(v, k); r.onsuccess = () => res(true); r.onerror = () => rej(r.error); }); },
  async del(k) { const s = await this.tx('readwrite'); return new Promise(res => { const r = s.delete(k); r.onsuccess = () => res(true); r.onerror = () => res(false); }); },
  async keys() { const s = await this.tx('readonly'); return new Promise(res => { const r = s.getAllKeys(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); }); }
};

const HAS_CLAUDE_STORE = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';

const Store = {
  mode: HAS_CLAUDE_STORE ? 'claude' : 'device',
  async get(k) {
    if (HAS_CLAUDE_STORE) { const r = await window.storage.get(k); return r && r.value; }
    let v = null;
    try { v = await IDB.get(k); } catch (e) { }
    if (v == null) { try { v = localStorage.getItem(k); } catch (e) { } }   // juna backup
    return v;
  },
  async set(k, v) {
    if (HAS_CLAUDE_STORE) { await window.storage.set(k, v); return; }
    await IDB.set(k, v);
    try { if (v.length < 3500000) localStorage.setItem(k, v); } catch (e) { }  // dusri copy
  },
  /* rojcha ek snapshot, shevatche 21 divas thevto */
  async snapshot(v) {
    if (HAS_CLAUDE_STORE) return;
    try {
      await IDB.set('snap:' + today(), v);
      const keys = (await IDB.keys()).filter(k => String(k).startsWith('snap:')).sort();
      while (keys.length > 21) { await IDB.del(keys.shift()); }
    } catch (e) { }
  },
  async snapshots() {
    if (HAS_CLAUDE_STORE) return [];
    try { return (await IDB.keys()).filter(k => String(k).startsWith('snap:')).sort().reverse(); } catch (e) { return []; }
  },
  async snapshotGet(k) { try { return await IDB.get(k); } catch (e) { return null; } }
};

/* browser la sanga: hi storage kadhi pusu nakos */
var PERSIST = false;
async function askPersist() {
  try {
    if (navigator.storage && navigator.storage.persist) {
      const already = await navigator.storage.persisted();
      PERSIST = already || (await navigator.storage.persist());
    }
  } catch (e) { }
}

/* service worker — offline chalnyasathi (fakt website var) */
(() => {
  try {
    if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
    }
  } catch (e) { }
})();

/* ============================================================
   SITE MANAGEMENT SYSTEM  —  data layer
   Excel madhli sagli automation ithe formulas mhanun lihileli aahe.
   ============================================================ */
const SEED = null;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const has = v => v !== '' && v != null;
/* status is case-insensitive, like Excel's SUMIF */
const st = r => String((r && r.status) || '').trim().toLowerCase() === 'paid' ? 'Paid' : 'Unpaid';
const today = () => new Date().toISOString().slice(0, 10);
const money = v => '\u20B9' + Math.round(num(v)).toLocaleString('en-IN');
const money0 = v => Math.round(num(v)).toLocaleString('en-IN');
const dec = (v, d = 1) => { const n = num(v); return (Math.round(n * 10 ** d) / 10 ** d).toLocaleString('en-IN'); };
const fmtDate = d => { if (!d) return '—'; const p = String(d).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0].slice(2) : d; };
const monthKey = d => String(d || '').slice(0, 7);
const monthName = k => { if (!k) return ''; const [y, m] = k.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m - 1] + ' ' + y.slice(2); };
const byDateDesc = (a, b) => String(b.date || '').localeCompare(String(a.date || '')) || String(b.id).localeCompare(String(a.id));

function toast(msg) {
  const t = $('#toast');
  t.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.innerHTML = '', 2200);
}

/* ---------- state ---------- */
let DB = { sites: [], activeId: null };
let TAB = 'dash';
let UI = {};            // per-tab filters etc.
let STORAGE_OK = true;

const site = () => DB.sites.find(s => s.id === DB.activeId) || DB.sites[0];

/* ---------- storage ---------- */
const KEY = 'vsms:db:v1';

async function load() {
  await askPersist();
  try {
    const v = await Store.get(KEY);
    if (v) DB = JSON.parse(v);
  } catch (e) {
    STORAGE_OK = false;
  }
  if (!DB.sites || !DB.sites.length) { DB = { sites: [seedSite()], activeId: null }; DB.activeId = DB.sites[0].id; await save(); }
  if (!DB.sites.find(s => s.id === DB.activeId)) DB.activeId = DB.sites[0].id;
  migrate();
}

/* juna version madhla data navin Excel-sync sathi taiyar karto */
function migrate() {
  let changed = false;
  DB.sites.forEach(s => {
    ['murumLog', 'funds', 'ownerPayments', 'advance'].forEach(k => { if (!s[k]) { s[k] = []; changed = true; } });
    if (!s.mods) { s.mods = { machine: true, diesel: true, murum: false, vendor: true, funds: false, owner: false }; changed = true; }
    if (!s.murumUnit) s.murumUnit = 'Brass';
    if (s.xlRows) return;
    changed = true;
    const seeded = s.seeded || s.name === 'Veershree Industrial Park';
    s.seeded = seeded;
    s.xlRows = seeded ? { ...SEED_ROWS } : { ...BASE_ROWS };
    Object.keys(XL).forEach(k => {
      const n = seeded ? (SEED[k] || []).length : 0;
      (s[k] || []).forEach((r, i) => { if (i < n) r.xl = true; });
    });
  });
  if (changed) save();
}

/* Excel madhe ajun na gelelya entries */
function pending(s, k) { return (s[k] || []).filter(r => !r.xl); }
function pendingCount(s) { return Object.keys(XL).reduce((a, k) => a + pending(s, k).length, 0); }

/* ---------- Excel paste block ---------- */
const XLDATE = d => {
  if (!d) return '';
  const p = String(d).split('-'); if (p.length !== 3) return d;
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return p[2] + '-' + M[+p[1] - 1] + '-' + p[0];
};
const clean = v => String(v == null ? '' : v).replace(/[\t\r\n]+/g, ' ');

function xlBlock(s, k, startRow) {
  const rows = pending(s, k);
  return rows.map((r, i) => {
    const n = startRow + i;
    let cells;
    if (k === 'machineLog') cells = [
      XLDATE(r.date), r.machineNo,
      `=IF($C${n}="","",IFERROR(INDEX('Machine Master'!$C$3:$C$102,MATCH($C${n},'Machine Master'!$B$3:$B$102,0)),"Not Found"))`,
      has(r.inR) ? r.inR : '', has(r.outR) ? r.outR : '',
      `=IF(OR($E${n}="",$F${n}=""),"",$F${n}-$E${n})`,
      has(r.diesel) ? r.diesel : '', r.remark
    ];
    else if (k === 'dieselLog') cells = [XLDATE(r.date), r.vendor, has(r.litres) ? r.litres : '', r.bill, has(r.amount) ? r.amount : '', st(r), r.paidBy, r.remark];
    else if (k === 'expenseLog') cells = [XLDATE(r.date), r.category, r.desc, r.vendor, has(r.amount) ? r.amount : '', st(r), r.paidBy, r.remark];
    else cells = [XLDATE(r.date), r.vendor, has(r.amount) ? r.amount : '', r.paidBy, r.mode, r.remark];
    return cells.map(clean).join('\t');
  }).join('\n');
}

let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  return new Promise(res => {
    saveTimer = setTimeout(async () => {
      const json = JSON.stringify(DB);
      try {
        await Store.set(KEY, json); STORAGE_OK = true;
        if (DB.lastSnap !== today()) { DB.lastSnap = today(); await Store.snapshot(json); }
      } catch (e) { STORAGE_OK = false; console.error('save failed', e); }
      res();
    }, 120);
  });
}

/* ---------- Excel sheet map (juna workbook la match hoto) ---------- */
const XL = {
  machineLog: { sheet: 'Machine Log', cols: 'B te I', first: 3, last: 2045, key: 'machineLog' },
  dieselLog: { sheet: 'Diesel Purchase', cols: 'B te I', first: 7, last: 505, key: 'dieselLog' },
  expenseLog: { sheet: 'Expense Log', cols: 'B te I', first: 7, last: 813, key: 'expenseLog' },
  vendorPayments: { sheet: 'Vendor Payment', cols: 'B te G', first: 8, last: 207, key: 'vendorPayments' }
};
/* jya row pasun tumchya sheet madhe pudhchi entry jaail */
const SEED_ROWS = { machineLog: 430, dieselLog: 47, expenseLog: 272, vendorPayments: 11 };
const BASE_ROWS = { machineLog: 3, dieselLog: 7, expenseLog: 7, vendorPayments: 8 };

/* ---------- site factory ---------- */
function blankSite(name) {
  return {
    id: uid(), name: name || 'New Site', created: today(),
    rateMaster: [
      { type: 'Poclain', basis: 'Hourly', packageRate: 0, packageUnits: 240 },
      { type: 'JCB', basis: 'Hourly', packageRate: 0, packageUnits: 240 },
      { type: 'Hiwa', basis: 'Daily', packageRate: 0, packageUnits: 30 },

function seedSite() {
  if (!SEED || !SEED.machines) return blankSite('Site 1');
  const s = blankSite('Veershree Industrial Park');
  s.seeded = true;
  s.xlRows = { ...SEED_ROWS };
  s.advance = ['Rushi', 'Sahil'];
  s.rateMaster = SEED.rateMaster.map(r => ({ type: r.type, basis: r.basis, packageRate: num(r.packageRate), packageUnits: num(r.packageUnits) || 1 }));
  s.machines = SEED.machines.map(m => ({ id: uid(), no: m.no, type: m.type, owner: m.owner, operator: m.operator, make: m.make, monthlyRate: m.monthlyRate === '' ? '' : num(m.monthlyRate) }));
  s.categories = SEED.categories.slice();
  s.people = SEED.people.slice();
  s.vendors = SEED.vendors.slice();
  s.dieselVendors = SEED.dieselVendors.slice();
  s.machineLog = SEED.machineLog.map(r => ({ id: uid(), xl: true, date: r.date, machineNo: r.machineNo, inR: r.inR, outR: r.outR, diesel: r.diesel, remark: r.remark }));
  s.dieselLog = SEED.dieselLog.map(r => ({ id: uid(), xl: true, date: r.date, vendor: r.vendor, litres: r.litres, bill: r.bill, amount: r.amount, status: st(r), paidBy: r.paidBy, remark: r.remark }));
  s.expenseLog = SEED.expenseLog.map(r => ({ id: uid(), xl: true, date: r.date, category: r.category, desc: r.desc, vendor: r.vendor, amount: r.amount, status: st(r), paidBy: r.paidBy, remark: r.remark }));
  s.vendorPayments = SEED.vendorPayments.map(r => ({ id: uid(), xl: true, date: r.date, vendor: r.vendor, amount: r.amount, paidBy: r.paidBy, mode: r.mode, remark: r.remark }));
  return s;
}

/* ============================================================
   CALCULATIONS  (Excel formulas -> JS)
   ============================================================ */

/* machine type lookup — Machine Log column D */
function machineType(s, no) { const m = s.machines.find(x => x.no === no); return m ? m.type : ''; }
function machineOf(s, no) { return s.machines.find(x => x.no === no) || null; }

/* hours = Out Reading - In Reading  (Machine Log column G) */
function hoursOf(r) { return (has(r.inR) && has(r.outR)) ? num(r.outR) - num(r.inR) : 0; }

/* rate basis + per hour/day rate — Machine Master G overrides Rate Master C */
function rateInfo(s, no) {
  const m = machineOf(s, no); if (!m) return { basis: '', unit: 0, rate: 0, units: 1 };
  const rm = s.rateMaster.find(r => r.type === m.type);
  if (!rm) return { basis: '', unit: 0, rate: 0, units: 1 };
  const rate = has(m.monthlyRate) && num(m.monthlyRate) > 0 ? num(m.monthlyRate) : num(rm.packageRate);
  const units = num(rm.packageUnits) || 1;
  return { basis: rm.basis, unit: rate / units, rate, units };
}

/* rent per machine. Daily basis = entry count, Hourly = sum of hours */
function machineRent(s, no, from, to) {
  const ri = rateInfo(s, no);
  const logs = s.machineLog.filter(r => r.machineNo === no && inRange(r.date, from, to));
  const hrs = logs.reduce((a, r) => a + hoursOf(r), 0);
  const diesel = logs.reduce((a, r) => a + num(r.diesel), 0);
  const qty = ri.basis === 'Daily' ? logs.length : hrs;
  return { ...ri, entries: logs.length, hours: hrs, diesel, qty, rent: ri.unit * qty };
}

function inRange(d, from, to) {
  if (!d) return false;
  if (from && d < from) return false;
  if (to && d > to) return false;
  return true;
}

/* --- vendor settlement (Expense Log J / K columns, FIFO per vendor) --- */
function settle(s) {
  const map = {};                                   // expenseId -> {final, by}
  const paidByVendor = {};                          // vendor -> total paid
  const payList = {};                               // vendor -> payments in order (running cum)
  s.vendorPayments.forEach(p => {
    const v = p.vendor || '';
    paidByVendor[v] = (paidByVendor[v] || 0) + num(p.amount);
    (payList[v] = payList[v] || []).push(p);
  });
  Object.keys(payList).forEach(v => {
    let c = 0; payList[v] = payList[v].map(p => ({ ...p, cum: (c += num(p.amount)) }));
  });
  const cumUnpaid = {};
  const ledger = s.expenseLog.concat((s.murumLog || []).map(m => ({ ...m, amount: mAmt(m), category: 'Murum', desc: m.desc || ('Murum ' + dec(m.qty) + ' ' + (s.murumUnit || 'Brass')) })));
  ledger.forEach(e => {
    if (st(e) === 'Paid') { map[e.id] = { final: 'Paid', by: e.paidBy || '' }; return; }
    if (!e.vendor) { map[e.id] = { final: 'Unpaid', by: '' }; return; }
    const c = cumUnpaid[e.vendor] = (cumUnpaid[e.vendor] || 0) + num(e.amount);
    const paid = paidByVendor[e.vendor] || 0;
    if (Math.round(paid * 100) >= Math.round(c * 100)) {
      const hit = (payList[e.vendor] || []).find(p => p.cum >= c - 0.001);
      map[e.id] = { final: 'Paid', by: hit ? (hit.paidBy || '') : '' };
    } else map[e.id] = { final: 'Unpaid', by: '' };
  });
  return map;
}

/* --- murum: amount = qty x rate, kiwa direct amount --- */
function mAmt(r) {
  if (has(r.amount) && num(r.amount)) return num(r.amount);
  return num(r.qty) * num(r.rate);
}

/* --- totals for the whole site (Plot Dashboard) --- */
function totals(s) {
  const fin = settle(s);
  const expTotal = s.expenseLog.reduce((a, e) => a + num(e.amount), 0);
  const expPaidDirect = s.expenseLog.filter(e => st(e) === 'Paid').reduce((a, e) => a + num(e.amount), 0);
  const expUnpaidRaw = s.expenseLog.filter(e => st(e) === 'Unpaid').reduce((a, e) => a + num(e.amount), 0);
  const expPaidFinal = s.expenseLog.filter(e => fin[e.id] && fin[e.id].final === 'Paid').reduce((a, e) => a + num(e.amount), 0);
  const expUnpaidFinal = expTotal - expPaidFinal;
  const dsTotal = s.dieselLog.reduce((a, d) => a + num(d.amount), 0);
  const dsPaid = s.dieselLog.filter(d => st(d) === 'Paid').reduce((a, d) => a + num(d.amount), 0);
  const dsUnpaid = s.dieselLog.filter(d => st(d) === 'Unpaid').reduce((a, d) => a + num(d.amount), 0);
  const dsLitres = s.dieselLog.reduce((a, d) => a + num(d.litres), 0);
  const mu = (s.murumLog || []);
  const muTotal = mu.reduce((a, r) => a + mAmt(r), 0);
  const muPaid = mu.filter(r => st(r) === 'Paid').reduce((a, r) => a + mAmt(r), 0);
  const muUnpaid = muTotal - muPaid;
  const muQty = mu.reduce((a, r) => a + num(r.qty), 0);
  const funds = (s.funds || []).reduce((a, r) => a + num(r.amount), 0);
  const ownerPaid = (s.ownerPayments || []).reduce((a, r) => a + num(r.amount), 0);
  const vp = s.vendorPayments.reduce((a, p) => a + num(p.amount), 0);
  const rent = s.machines.reduce((a, m) => a + machineRent(s, m.no).rent, 0);
  return {
    fin, expTotal, expPaidDirect, expUnpaidRaw, expPaidFinal, expUnpaidFinal,
    dsTotal, dsPaid, dsUnpaid, dsLitres, vendorPaid: vp, rent,
    muTotal, muPaid, muUnpaid, muQty, funds, ownerPaid,
    grand: expTotal + dsTotal + rent + muTotal,
    netPending: (expUnpaidRaw + dsUnpaid + muUnpaid) - vp
  };
}

/* --- per person (Manager Dashboard + naav-nihay sheets) --- */
function personStats(s, name) {
  const siteExp = s.expenseLog.filter(e => st(e) === 'Paid' && e.paidBy === name);
  const diesel = s.dieselLog.filter(d => st(d) === 'Paid' && d.paidBy === name);
  const vpay = s.vendorPayments.filter(p => p.paidBy === name);
  const murum = (s.murumLog || []).filter(m => st(m) === 'Paid' && m.paidBy === name);
  const opay = (s.ownerPayments || []).filter(p => p.paidBy === name);
  const got = (s.funds || []).filter(f => f.person === name);
  const sum = (arr, k) => arr.reduce((a, r) => a + num(r[k]), 0);
  const mu = murum.reduce((a, r) => a + mAmt(r), 0);
  const total = sum(siteExp, 'amount') + sum(diesel, 'amount') + sum(vpay, 'amount') + mu + sum(opay, 'amount');
  const received = sum(got, 'amount');
  return {
    siteExp, diesel, vpay, murum, opay, got,
    site: sum(siteExp, 'amount'), dsl: sum(diesel, 'amount'), vp: sum(vpay, 'amount'),
    mu, op: sum(opay, 'amount'), received, total, balance: received - total,
    getsAdvance: (s.advance || []).includes(name)
  };
}

/* --- per vendor (Vendor Dashboard) --- */
function vendorStats(s, v) {
  const mu = (s.murumLog || []).filter(m => m.vendor === v);
  const total = s.expenseLog.filter(e => e.vendor === v).reduce((a, e) => a + num(e.amount), 0) + mu.reduce((a, m) => a + mAmt(m), 0);
  const direct = s.expenseLog.filter(e => e.vendor === v && st(e) === 'Paid').reduce((a, e) => a + num(e.amount), 0) + mu.filter(m => st(m) === 'Paid').reduce((a, m) => a + mAmt(m), 0);
  const paid = s.vendorPayments.filter(p => p.vendor === v).reduce((a, p) => a + num(p.amount), 0);
  return { total, direct, paid, totalPaid: direct + paid, remaining: total - direct - paid };
}

/* --- machine owner: rent payable vs dilele paise --- */
function ownerList(s) { return [...new Set(s.machines.map(m => m.owner).filter(Boolean))].sort(); }
function ownerStats(s, owner) {
  const ms = s.machines.filter(m => m.owner === owner);
  const rent = ms.reduce((a, m) => a + machineRent(s, m.no).rent, 0);
  const paid = (s.ownerPayments || []).filter(p => p.owner === owner).reduce((a, p) => a + num(p.amount), 0);
  return { machines: ms, rent, paid, balance: rent - paid };
}

/* --- diesel vendor summary --- */
function dieselVendorStats(s, v) {
  const rows = s.dieselLog.filter(d => d.vendor === v);
  const sum = k => rows.reduce((a, r) => a + num(r[k]), 0);
  return {
    litres: sum('litres'), amount: sum('amount'), bills: rows.length,
    paid: rows.filter(r => st(r) === 'Paid').reduce((a, r) => a + num(r.amount), 0),
    unpaid: rows.filter(r => st(r) === 'Unpaid').reduce((a, r) => a + num(r.amount), 0)
  };
}

/* --- category summary --- */
function categoryStats(s, c, fin) {
  const rows = s.expenseLog.filter(e => e.category === c);
  const paid = rows.filter(e => fin[e.id] && fin[e.id].final === 'Paid').reduce((a, e) => a + num(e.amount), 0);
  const total = rows.reduce((a, e) => a + num(e.amount), 0);
  return { entries: rows.length, total, paid, unpaid: total - paid };
}

/* --- last 12 months --- */
function monthSeries(s, fin) {
  const out = []; const d = new Date();
  for (let i = 11; i >= 0; i--) {
    const dt = new Date(d.getFullYear(), d.getMonth() - i, 1);
    const k = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
    const rows = s.expenseLog.filter(e => monthKey(e.date) === k);
    const dsl = s.dieselLog.filter(x => monthKey(x.date) === k).reduce((a, x) => a + num(x.amount), 0);
    const total = rows.reduce((a, e) => a + num(e.amount), 0);
    const paid = rows.filter(e => fin[e.id] && fin[e.id].final === 'Paid').reduce((a, e) => a + num(e.amount), 0);
    out.push({ k, total, paid, unpaid: total - paid, diesel: dsl });
  }
  return out;
}

  <div class="btnrow" style="margin-bottom:12px">
    <button class="btn sec sm" style="flex:1" data-act="share">Summary share</button>
    <button class="btn sec sm" style="flex:1" data-act="dayReg">Divas cha hishob</button>
  </div>`;
};

/* ---------------- MACHINE ---------------- */
VIEW.machine = s => {
  const k = sub('machine');
  if (k === 'owner') return ownerView(s);
  if (k === 'log') return machineLogView(s);
  if (k === 'sum') return machineSumView(s);
  if (k === 'rent') return machineRentView(s);
  return machineMasterView(s);
};

function machineLogView(s) {
  const f = UI.mlFilter || '';
  let rows = s.machineLog.slice().sort(byDateDesc);
  if (f === '__none') rows = rows.filter(r => !r.machineNo);
  else if (f) rows = rows.filter(r => r.machineNo === f);
  const noMachine = s.machineLog.filter(r => !r.machineNo).length;
  const shown = rows.slice(0, UI.mlMore || 60);
  const hrs = rows.reduce((a, r) => a + hoursOf(r), 0), dsl = rows.reduce((a, r) => a + num(r.diesel), 0);
  return `
  <button class="btn" data-act="mlAdd">+ Machine entry</button>
  <div class="kpis k3 mt">
    <div class="kpi"><div class="k">ENTRIES</div><div class="v num">${rows.length}</div></div>
    <div class="kpi b"><div class="k">TOTAL HOURS</div><div class="v num">${dec(hrs)}</div></div>
    <div class="kpi"><div class="k">DIESEL (L)</div><div class="v num">${dec(dsl)}</div></div>
  </div>
  <div class="card">
    <div class="chips">
      <button class="chip ${!f ? 'on' : ''}" data-act="mlFilter" data-v="">Sagle</button>
      ${noMachine ? `<button class="chip ${f === '__none' ? 'on' : ''}" data-act="mlFilter" data-v="__none">Machine nahi (${noMachine})</button>` : ''}
      ${s.machines.map(m => `<button class="chip ${f === m.no ? 'on' : ''}" data-act="mlFilter" data-v="${esc(m.no)}">${esc(m.no)}</button>`).join('')}
    </div>
    ${shown.length ? shown.map(r => {
      const h = hoursOf(r);
      return `<div class="row" data-act="mlEdit" data-v="${r.id}">
        <div class="main">
          <div class="ttl">${r.machineNo ? esc(r.machineNo) + ' <span class="pill n">' + esc(machineType(s, r.machineNo) || 'type nahi') + '</span>' : '<span class="pill u">machine no takaycha aahe</span>'}</div>
          <div class="sub">${fmtDate(r.date)} &nbsp;&middot;&nbsp; ${has(r.inR) ? dec(r.inR, 1) : '—'} &rarr; ${has(r.outR) ? dec(r.outR, 1) : '—'}${r.diesel ? ' &nbsp;&middot;&nbsp; ' + dec(r.diesel) + ' L' : ''}${r.remark ? ' &nbsp;&middot;&nbsp; ' + esc(r.remark) : ''}</div>
        </div>
        <div class="amt">${dec(h)}<div class="tiny" style="font-weight:500">hr</div></div>
      </div>`;
    }).join('') : '<div class="empty">Ajun entry nahi. Var "+ Machine entry" dabun suru kara.</div>'}
    ${rows.length > shown.length ? `<div class="pad center"><button class="btn sec sm" data-act="mlMore">Ajun ${rows.length - shown.length} entries dakhva</button></div>` : ''}
  </div>`;
}

function machineSumView(s) {
  const rows = s.machines.map(m => ({ m, r: machineRent(s, m.no) }));
  const types = [...new Set(s.machines.map(m => m.type).filter(Boolean))];
  const tot = {
    e: s.machineLog.length,
    h: s.machineLog.reduce((a, r) => a + hoursOf(r), 0),
    d: s.machineLog.reduce((a, r) => a + num(r.diesel), 0)
  };
  const unassigned = s.machineLog.filter(r => !r.machineNo);
  return `
  <div class="kpis">
    <div class="kpi"><div class="k">MACHINES</div><div class="v num">${s.machines.length}</div></div>
    <div class="kpi"><div class="k">LOG ENTRIES</div><div class="v num">${tot.e}</div></div>
    <div class="kpi b"><div class="k">TOTAL HOURS</div><div class="v num">${dec(tot.h)}</div></div>
    <div class="kpi"><div class="k">DIESEL (L)</div><div class="v num">${dec(tot.d)}</div></div>
  </div>
  ${unassigned.length ? `<div class="warn">${unassigned.length} entries madhe machine no nahi &mdash; tyanche ${dec(unassigned.reduce((a, r) => a + hoursOf(r), 0))} hours konatyach machine chya rent madhe jaat nahit. <b>Daily Log &rarr; "Machine nahi"</b> madhun te dursta kara.</div>` : ''}
  <div class="card"><h3>Type-wise</h3><div class="scroll"><table>
    <thead><tr><th>Type</th><th class="n">Count</th><th class="n">Entries</th><th class="n">Hours</th><th class="n">Diesel</th><th class="n">Rent</th></tr></thead>
    <tbody>${types.map(t => {
      const list = rows.filter(x => x.m.type === t);
      return `<tr><td>${esc(t)}</td><td class="n">${list.length}</td><td class="n">${list.reduce((a, x) => a + x.r.entries, 0)}</td><td class="n">${dec(list.reduce((a, x) => a + x.r.hours, 0))}</td><td class="n">${dec(list.reduce((a, x) => a + x.r.diesel, 0))}</td><td class="n">${money0(list.reduce((a, x) => a + x.r.rent, 0))}</td></tr>`;
    }).join('')}</tbody></table></div></div>
  <div class="card"><h3>Machine-wise</h3><div class="scroll"><table>
    <thead><tr><th>Machine</th><th>Owner</th><th class="n">Entries</th><th class="n">Hours</th><th class="n">Diesel</th><th class="n">Rent</th></tr></thead>
    <tbody>${rows.filter(x => x.r.entries).sort((a, b) => b.r.hours - a.r.hours).map(x => `<tr><td class="nowrap"><b>${esc(x.m.no)}</b><div class="tiny">${esc(x.m.type)}</div></td><td class="tiny">${esc(x.m.owner || '—')}</td><td class="n">${x.r.entries}</td><td class="n">${dec(x.r.hours)}</td><td class="n">${dec(x.r.diesel)}</td><td class="n">${money0(x.r.rent)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Log entry nahi.</td></tr>'}</tbody>
  </table></div></div>`;
}

function machineRentView(s) {
  const no = UI.rentMachine || (s.machines[0] && s.machines[0].no) || '';
  const from = UI.rentFrom || '', to = UI.rentTo || '';
  const m = machineOf(s, no); const r = no ? machineRent(s, no, from, to) : null;
  const logs = no ? s.machineLog.filter(x => x.machineNo === no && inRange(x.date, from, to)).sort(byDateDesc) : [];
  return `
  <div class="card"><h3>Machine ani period nivda</h3><div class="pad">
    <div class="field"><label>Machine No</label><select data-act="rentMachine">${s.machines.map(x => `<option ${x.no === no ? 'selected' : ''}>${esc(x.no)}</option>`).join('')}</select></div>
    <div class="f2">
      <div class="field"><label>From Date</label><input type="date" value="${from}" data-act="rentFrom"></div>
      <div class="field"><label>To Date</label><input type="date" value="${to}" data-act="rentTo"></div>
    </div>
    <div class="tiny">Date rikami thevli tar suruvat pasun aajparyant cha hishob disel.</div>
  </div></div>
  ${!m ? '<div class="empty">Machine Master madhe machine add kara.</div>' : `
  <div class="hero">
    <div class="lbl">RENT PAYABLE &mdash; ${esc(no)}</div>
    <div class="big"><small>&#8377;</small>${money0(r.rent)}</div>
    <div class="hsplit">
      <div><div class="k">${r.basis === 'Daily' ? 'DAYS' : 'HOURS'}</div><div class="v num">${dec(r.qty)}</div></div>
      <div><div class="k">RATE / ${r.basis === 'Daily' ? 'DAY' : 'HR'}</div><div class="v num">${dec(r.unit, 0)}</div></div>
      <div><div class="k">DIESEL (L)</div><div class="v num">${dec(r.diesel)}</div></div>
    </div>
  </div>
  <div class="card"><h3>Machine details</h3><div class="scroll"><table><tbody>
    <tr><td class="muted">Type</td><td class="right"><b>${esc(m.type || '—')}</b></td></tr>
    <tr><td class="muted">Owner</td><td class="right"><b>${esc(m.owner || '—')}</b></td></tr>
    <tr><td class="muted">Operator</td><td class="right"><b>${esc(m.operator || '—')}</b></td></tr>
    <tr><td class="muted">Make</td><td class="right"><b>${esc(m.make || '—')}</b></td></tr>
    <tr><td class="muted">Rate Basis</td><td class="right"><b>${esc(r.basis || '—')}</b></td></tr>
    <tr><td class="muted">Package Rate</td><td class="right n"><b>${money0(r.rate)}</b> / ${r.units} ${r.basis === 'Daily' ? 'days' : 'hr'}</td></tr>
    <tr><td class="muted">Entries in period</td><td class="right n"><b>${r.entries}</b></td></tr>
  </tbody></table></div></div>
  <div class="card"><h3>Ya machine chya entries<small>${logs.length}</small></h3>
    ${logs.slice(0, 40).map(x => `<div class="row"><div class="main"><div class="ttl">${fmtDate(x.date)}</div><div class="sub">${has(x.inR) ? dec(x.inR, 1) : '—'} &rarr; ${has(x.outR) ? dec(x.outR, 1) : '—'}${x.diesel ? ' &middot; ' + dec(x.diesel) + ' L' : ''}</div></div><div class="amt">${dec(hoursOf(x))}<div class="tiny" style="font-weight:500">hr</div></div></div>`).join('') || '<div class="empty">Ya period madhe entry nahi.</div>'}
  </div>`}`;
}

function machineMasterView(s) {
  return `
  <button class="btn" data-act="mAdd">+ Machine add kara</button>
  <div class="card mt"><h3>Rate Master<small>rate ithe bhara</small></h3><div class="scroll"><table>
    <thead><tr><th>Type</th><th>Basis</th><th class="n">Package Rate</th><th class="n">Units</th><th class="n">Per Hr/Day</th></tr></thead>
    <tbody>${s.rateMaster.map((r, i) => `<tr data-act="rmEdit" data-v="${i}"><td><b>${esc(r.type)}</b></td><td class="tiny">${esc(r.basis)}</td><td class="n">${r.packageRate ? money0(r.packageRate) : '<span class="pill u">bharaycha</span>'}</td><td class="n">${r.packageUnits}</td><td class="n">${r.packageRate ? dec(num(r.packageRate) / (num(r.packageUnits) || 1), 0) : '—'}</td></tr>`).join('')}</tbody>
  </table></div><div class="pad tiny">Row var tap karun rate badla. Machine chya swatanchya rate sathi khalchya list madhun ti machine ughada.</div></div>
  <div class="card"><h3>Machines<small>${s.machines.length}</small></h3>
    ${s.machines.map(m => `<div class="row" data-act="mEdit" data-v="${m.id}">
      <div class="main"><div class="ttl">${esc(m.no)} <span class="pill n">${esc(m.type)}</span></div>
      <div class="sub">${esc(m.owner || 'owner nahi')}${m.operator ? ' &middot; ' + esc(m.operator) : ''}${m.make ? ' &middot; ' + esc(m.make) : ''}</div></div>
      <div class="amt tiny" style="font-weight:600">${has(m.monthlyRate) && num(m.monthlyRate) ? money0(m.monthlyRate) : ''}</div>
    </div>`).join('') || '<div class="empty">Ajun machine nahi.</div>'}
  </div>`;
}

/* ---------------- DIESEL ---------------- */
VIEW.diesel = s => sub('diesel') === 'log' ? dieselLogView(s) : dieselSumView(s);

function dieselLogView(s) {
  const rows = s.dieselLog.slice().sort(byDateDesc);
  const shown = rows.slice(0, UI.dlMore || 50);
  const t = totals(s);
  return `
  <button class="btn" data-act="dAdd">+ Diesel entry</button>
  <div class="kpis k3 mt">
    <div class="kpi"><div class="k">TOTAL DIESEL</div><div class="v num">${dec(t.dsLitres)} L</div></div>
    <div class="kpi g"><div class="k">PAID</div><div class="v num">${money0(t.dsPaid)}</div></div>
    <div class="kpi r"><div class="k">UNPAID</div><div class="v num">${money0(t.dsUnpaid)}</div></div>
  </div>
  <div class="card">${shown.length ? shown.map(d => `<div class="row" data-act="dEdit" data-v="${d.id}">
      <div class="main"><div class="ttl">${esc(d.vendor)} <span class="pill ${st(d) === 'Paid' ? 'p' : 'u'}">${st(d)}</span></div>
      <div class="sub">${fmtDate(d.date)} &middot; ${dec(d.litres)} L${num(d.litres) ? ' @ ' + dec(num(d.amount) / num(d.litres), 2) : ''}${d.paidBy ? ' &middot; ' + esc(d.paidBy) : ''}${d.bill && d.bill !== '-' ? ' &middot; Bill ' + esc(d.bill) : ''}</div></div>
      <div class="amt">${money0(d.amount)}</div></div>`).join('') : '<div class="empty">Ajun diesel entry nahi.</div>'}
    ${rows.length > shown.length ? `<div class="pad center"><button class="btn sec sm" data-act="dlMore">Ajun ${rows.length - shown.length} dakhva</button></div>` : ''}
  </div>`;
}

function dieselSumView(s) {
  const t = totals(s);
  const avg = t.dsLitres ? t.dsTotal / t.dsLitres : 0;
  return `
  <div class="kpis">
    <div class="kpi"><div class="k">TOTAL LITRES</div><div class="v num">${dec(t.dsLitres)}</div></div>
    <div class="kpi"><div class="k">TOTAL AMOUNT</div><div class="v num">${money0(t.dsTotal)}</div></div>
    <div class="kpi"><div class="k">AVG RATE / L</div><div class="v num">${dec(avg, 2)}</div></div>
    <div class="kpi r"><div class="k">UNPAID</div><div class="v num">${money0(t.dsUnpaid)}</div></div>
  </div>
  <div class="card"><h3>Vendor-wise</h3><div class="scroll"><table>
    <thead><tr><th>Vendor</th><th class="n">Litres</th><th class="n">Amount</th><th class="n">Paid</th><th class="n">Unpaid</th><th class="n">Bills</th></tr></thead>
    <tbody>${s.dieselVendors.map(v => { const x = dieselVendorStats(s, v); return `<tr><td class="nowrap">${esc(v)}</td><td class="n">${dec(x.litres)}</td><td class="n">${money0(x.amount)}</td><td class="n">${money0(x.paid)}</td><td class="n" style="color:${x.unpaid ? 'var(--due)' : 'inherit'}">${money0(x.unpaid)}</td><td class="n">${x.bills}</td></tr>`; }).join('') || '<tr><td colspan="6" class="muted">Diesel vendor add kara.</td></tr>'}</tbody>
  </table></div></div>
  <div class="card"><h3>Machine-wise diesel</h3><div class="scroll"><table>
    <thead><tr><th>Machine</th><th class="n">Diesel (L)</th><th class="n">Hours</th><th class="n">L / hr</th></tr></thead>
    <tbody>${s.machines.map(m => ({ m, r: machineRent(s, m.no) })).filter(x => x.r.diesel > 0).sort((a, b) => b.r.diesel - a.r.diesel).map(x => `<tr><td class="nowrap"><b>${esc(x.m.no)}</b></td><td class="n">${dec(x.r.diesel)}</td><td class="n">${dec(x.r.hours)}</td><td class="n">${x.r.hours ? dec(x.r.diesel / x.r.hours, 2) : '—'}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Machine Log madhe diesel bharla ki ithe disel.</td></tr>'}</tbody>
  </table></div></div>`;
}

/* ---------------- EXPENSE ---------------- */
VIEW.expense = s => sub('expense') === 'log' ? expenseLogView(s) : expenseSumView(s);

function expenseLogView(s) {
  const fin = settle(s);
  const f = UI.exCat || '';
  let rows = s.expenseLog.slice().sort(byDateDesc);
  if (f === '__unpaid') rows = rows.filter(e => fin[e.id].final === 'Unpaid');
  else if (f) rows = rows.filter(e => e.category === f);
  const shown = rows.slice(0, UI.exMore || 50);
  const sum = rows.reduce((a, e) => a + num(e.amount), 0);
  const t = totals(s);
  const tm = s.expenseLog.filter(e => monthKey(e.date) === monthKey(today())).reduce((a, e) => a + num(e.amount), 0);
  return `
  <button class="btn" data-act="eAdd">+ Kharch entry</button>
  <div class="kpis k3 mt">
    <div class="kpi"><div class="k">TOTAL</div><div class="v num">${money0(t.expTotal)}</div></div>
    <div class="kpi"><div class="k">THIS MONTH</div><div class="v num">${money0(tm)}</div></div>
    <div class="kpi r"><div class="k">PENDING</div><div class="v num">${money0(t.expUnpaidFinal)}</div></div>
  </div>
  <div class="card">
    <div class="chips">
      <button class="chip ${!f ? 'on' : ''}" data-act="exCat" data-v="">Sagle</button>
      <button class="chip ${f === '__unpaid' ? 'on' : ''}" data-act="exCat" data-v="__unpaid">Unpaid</button>
      ${s.categories.map(c => `<button class="chip ${f === c ? 'on' : ''}" data-act="exCat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}
    </div>
    ${f ? `<div class="pad tiny" style="border-bottom:1px solid var(--line-2)">${rows.length} entries &middot; total <b class="num">${money(sum)}</b></div>` : ''}
    ${shown.length ? shown.map(e => {
      const fs = fin[e.id];
      return `<div class="row" data-act="eEdit" data-v="${e.id}">
        <div class="main"><div class="ttl">${esc(e.desc || e.category)} <span class="pill ${fs.final === 'Paid' ? 'p' : 'u'}">${fs.final}</span></div>
        <div class="sub">${fmtDate(e.date)} &middot; ${esc(e.category)}${e.vendor ? ' &middot; ' + esc(e.vendor) : ''}${fs.by ? ' &middot; ' + esc(fs.by) : ''}</div></div>
        <div class="amt">${money0(e.amount)}</div></div>`;
    }).join('') : '<div class="empty">Ithe kahi nahi.</div>'}
    ${rows.length > shown.length ? `<div class="pad center"><button class="btn sec sm" data-act="exMore">Ajun ${rows.length - shown.length} dakhva</button></div>` : ''}
  </div>`;
}

function expenseSumView(s) {
  const t = totals(s), fin = t.fin;
  const cats = s.categories.map(c => ({ c, x: categoryStats(s, c, fin) })).filter(o => o.x.entries).sort((a, b) => b.x.total - a.x.total);
  const max = Math.max(1, ...cats.map(o => o.x.total));
  const months = monthSeries(s, fin).filter(m => m.total || m.diesel);
  const tday = s.expenseLog.filter(e => e.date === today()).reduce((a, e) => a + num(e.amount), 0);
  return `
  <div class="kpis">
    <div class="kpi"><div class="k">TOTAL</div><div class="v num">${money0(t.expTotal)}</div></div>
    <div class="kpi g"><div class="k">PAID</div><div class="v num">${money0(t.expPaidFinal)}</div></div>
    <div class="kpi r"><div class="k">PENDING</div><div class="v num">${money0(t.expUnpaidFinal)}</div></div>
    <div class="kpi"><div class="k">AAJ CHA KHARCH</div><div class="v num">${money0(tday)}</div></div>
  </div>
  <div class="card"><h3>Category-wise</h3>
    ${cats.map(o => `<div class="row" style="display:block">
      <div style="display:flex;justify-content:space-between;gap:8px"><div class="ttl">${esc(o.c)}</div><div class="amt">${money0(o.x.total)}</div></div>
      <div class="bar"><i style="width:${(o.x.total / max * 100).toFixed(1)}%"></i></div>
      <div class="sub">${o.x.entries} entries &middot; paid ${money0(o.x.paid)}${o.x.unpaid ? ' &middot; <b style="color:var(--due)">pending ' + money0(o.x.unpaid) + '</b>' : ''} &middot; ${(o.x.total / (t.expTotal || 1) * 100).toFixed(1)}%</div>
    </div>`).join('') || '<div class="empty">Kharch entry kelyavar summary disel.</div>'}
  </div>
  <div class="card"><h3>Month-wise</h3><div class="scroll"><table>
    <thead><tr><th>Month</th><th class="n">Site</th><th class="n">Diesel</th><th class="n">Paid</th><th class="n">Pending</th></tr></thead>
    <tbody>${months.map(m => `<tr><td class="nowrap">${monthName(m.k)}</td><td class="n">${money0(m.total)}</td><td class="n">${money0(m.diesel)}</td><td class="n">${money0(m.paid)}</td><td class="n" style="color:${m.unpaid ? 'var(--due)' : 'inherit'}">${money0(m.unpaid)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">Data nahi.</td></tr>'}</tbody>
  </table></div></div>`;
}

/* ---------------- VENDOR ---------------- */
VIEW.vendor = s => { const k = sub('vendor'); return k === 'pend' ? vendorPendView(s) : k === 'pay' ? vendorPayView(s) : vendorSumView(s); };

function vendorPendView(s) {
  const fin = settle(s);
  const pend = s.expenseLog.filter(e => fin[e.id].final === 'Unpaid').sort(byDateDesc);
  const byV = {}; pend.forEach(e => { const v = e.vendor || '(vendor nahi)'; (byV[v] = byV[v] || []).push(e); });
  const dieselPend = s.dieselLog.filter(d => st(d) === 'Unpaid');
  const total = pend.reduce((a, e) => a + num(e.amount), 0);
  return `
  <div class="kpis">
    <div class="kpi r"><div class="k">SITE PENDING</div><div class="v num">${money0(total)}</div></div>
    <div class="kpi r"><div class="k">DIESEL PENDING</div><div class="v num">${money0(dieselPend.reduce((a, d) => a + num(d.amount), 0))}</div></div>
  </div>
  ${Object.keys(byV).sort().map(v => {
    const list = byV[v]; const vs = v === '(vendor nahi)' ? null : vendorStats(s, v);
    return `<div class="card"><h3>${esc(v)}<small>baki ${money(list.reduce((a, e) => a + num(e.amount), 0))}</small></h3>
      ${list.map(e => `<div class="row" data-act="eEdit" data-v="${e.id}"><div class="main"><div class="ttl">${esc(e.desc || e.category)}</div><div class="sub">${fmtDate(e.date)} &middot; ${esc(e.category)}</div></div><div class="amt">${money0(e.amount)}</div></div>`).join('')}
      ${vs ? `<div class="pad"><button class="btn sm" data-act="vpAdd" data-v="${esc(v)}">Payment kara</button></div>` : ''}

/* ---------- zip (store, no compression) ---------- */
const CRC_T = (() => { const t = new Int32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c; } return t; })();
function crc32(b) { let c = -1; for (let i = 0; i < b.length; i++) c = (c >>> 8) ^ CRC_T[(c ^ b[i]) & 0xFF]; return (c ^ -1) >>> 0; }
const ENC = new TextEncoder();

function zipStore(files) {
  const parts = [], central = [];
  let off = 0;
  files.forEach(f => {
    const name = ENC.encode(f.name), data = f.data, crc = crc32(data);
    const lh = new Uint8Array(30 + name.length), dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0x2821, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
    dv.setUint16(26, name.length, true); dv.setUint16(28, 0, true);
    lh.set(name, 30);
    parts.push(lh, data);
    const ch = new Uint8Array(46 + name.length), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0x2821, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, name.length, true); cv.setUint32(42, off, true);
    ch.set(name, 46);
    central.push(ch);
    off += lh.length + data.length;
  });
  const cdSize = central.reduce((a, c) => a + c.length, 0);
  const end = new Uint8Array(22), ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, off, true);
  const all = parts.concat(central, [end]);
  const total = all.reduce((a, p) => a + p.length, 0);
  const out = new Uint8Array(total);
  let p = 0; all.forEach(x => { out.set(x, p); p += x.length; });
  return out;
}

const X = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function colL(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; }
function serial(d) { const p = String(d).split('-'); if (p.length !== 3) return null; return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000) + 25569; }

/* cell builders */
const SY = { title: 1, head: 2, col: 3, txt: 4, date: 5, money: 6, dec1: 7, dec2: 8, bold: 9, tot: 10, kpiL: 11, kpiV: 12, int: 13, note: 14, sub: 15 };
const T = (v, s) => ({ t: 's', v, s: s == null ? SY.txt : s });
const N_ = (v, s) => ({ t: 'n', v, s: s == null ? SY.money : s });
const D_ = (v, s) => { const x = serial(v); return x == null ? T(v, s == null ? SY.date : s) : { t: 'n', v: x, s: s == null ? SY.date : s }; };
const F_ = (f, s) => ({ t: 'f', f, s: s == null ? SY.money : s });
const E_ = null;

function sheetXml(sh) {
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  x += '<sheetViews><sheetView workbookViewId="0" showGridLines="0"';
  x += (sh.tabSelected ? ' tabSelected="1"' : '') + '>';
  if (sh.freeze) x += `<pane ySplit="${sh.freeze}" topLeftCell="A${sh.freeze + 1}" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft"/>`;
  x += '</sheetView></sheetViews><sheetFormatPr defaultRowHeight="16"/>';
  if (sh.cols && sh.cols.length) {
    x += '<cols>' + sh.cols.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('') + '</cols>';
  }
  x += '<sheetData>';
  sh.rows.forEach((row, ri) => {
    if (!row) return;
    const r = ri + 1;
    const cells = row.map((c, ci) => {
      if (c == null) return '';
      const ref = colL(ci + 1) + r;
      const s = c.s ? ` s="${c.s}"` : '';
      if (c.t === 'f') return `<c r="${ref}"${s}><f>${X(c.f)}</f></c>`;
      if (c.t === 'n') return `<c r="${ref}"${s}><v>${c.v}</v></c>`;
      if (c.v === '' || c.v == null) return `<c r="${ref}"${s}/>`;
      return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${X(c.v)}</t></is></c>`;
    }).join('');
    if (!cells) return;
    const ht = sh.heights && sh.heights[r] ? ` ht="${sh.heights[r]}" customHeight="1"` : '';
    x += `<row r="${r}"${ht}>${cells}</row>`;
  });
  x += '</sheetData>';
  if (sh.merges && sh.merges.length) x += `<mergeCells count="${sh.merges.length}">` + sh.merges.map(m => `<mergeCell ref="${m}"/>`).join('') + '</mergeCells>';
  if (sh.dv && sh.dv.length) x += `<dataValidations count="${sh.dv.length}">` + sh.dv.map(d => `<dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" sqref="${d.sq}"><formula1>${X(d.f)}</formula1></dataValidation>`).join('') + '</dataValidations>';
  x += '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/></worksheet>';
  return x;
}

/* ---------- workbook builder ---------- */
function buildWorkbook(s) {
  const m = s.mods || {};
  const SPARE = 200;
  const ml = s.machineLog, dl = s.dieselLog, el = s.expenseLog, vp = s.vendorPayments;
  const mu = s.murumLog || [], fn = s.funds || [], op = s.ownerPayments || [];
  const R = n => n + 2 + SPARE;                       // shevatchi row (header row 2, data row 3 pasun)
  const mlL = R(ml.length), dlL = R(dl.length), elL = R(el.length), vpL = R(vp.length);
  const muL = R(mu.length), fnL = R(fn.length), opL = R(op.length);
  const mmL = s.machines.length + 2 + 50, rmL = s.rateMaster.length + 2 + 10;
  const mstL = Math.max(s.categories.length, s.vendors.length, s.dieselVendors.length, s.people.length) + 2 + 30;
  const mrL = s.machines.length + 2;
  const Q = "'";
  const SH = {};                                       // sheet name -> included

  const titleRow = (txt, span) => ({ row: [T(txt, SY.title)], merge: 'A1:' + colL(span) + '1' });
  const sheets = [];

  /* ---------- log sheet factory ---------- */
  function logSheet(name, cols, widths, data, rowFn, extra) {
    const rows = [];
    rows[0] = [T(s.name + '  \u2014  ' + name, SY.title)];
    rows[1] = cols.map(c => T(c, SY.col));
    const n = data.length + SPARE;
    for (let i = 0; i < n; i++) {
      const r = i + 3;
      rows[r - 1] = rowFn(data[i], r, i);
    }
    return Object.assign({
      name, freeze: 2, cols: widths, rows,
      merges: ['A1:' + colL(cols.length) + '1'],
      heights: { 1: 26, 2: 28 }
    }, extra || {});
  }

  /* ---------- Machine Log ---------- */
  if (m.machine !== false) {
    sheets.push(logSheet('Machine Log',
      ['Sr No', 'Date', 'Machine No', 'Machine Type', 'In Reading', 'Out Reading', 'Total Hr', 'Diesel Filled (L)', 'Remark'],
      [7, 13, 13, 14, 12, 12, 10, 13, 26], ml,
      (r, n) => [
        F_(`IF($C${n}="","",COUNTA($C$3:$C${n}))`, SY.int),
        r ? D_(r.date) : E_,
        r ? T(r.machineNo) : T('', SY.txt),
        F_(`IF($C${n}="","",IFERROR(INDEX('Machine Master'!$C$3:$C$${mmL},MATCH($C${n},'Machine Master'!$B$3:$B$${mmL},0)),"Not Found"))`, SY.txt),
        r && has(r.inR) ? N_(num(r.inR), SY.dec1) : E_,
        r && has(r.outR) ? N_(num(r.outR), SY.dec1) : E_,
        F_(`IF(OR($E${n}="",$F${n}=""),"",$F${n}-$E${n})`, SY.dec1),
        r && has(r.diesel) ? N_(num(r.diesel), SY.dec1) : E_,
        r ? T(r.remark) : T('', SY.txt)
      ],
      { dv: [{ sq: `C3:C${mlL}`, f: `'Machine Master'!$B$3:$B$${mmL}` }] }));
  }

  /* ---------- Diesel ---------- */
  if (m.diesel !== false) {
    sheets.push(logSheet('Diesel Purchase',
      ['Sr No', 'Date', 'Diesel Vendor', 'Diesel (L)', 'Bill No', 'Amount (Rs)', 'Status', 'Paid By', 'Rate / L', 'Remark'],
      [7, 13, 20, 11, 11, 14, 10, 13, 10, 24], dl,
      (r, n) => [
        F_(`IF($B${n}="","",COUNTA($B$3:$B${n}))`, SY.int),
        r ? D_(r.date) : E_,
        r ? T(r.vendor) : T('', SY.txt),
        r && has(r.litres) ? N_(num(r.litres), SY.dec2) : E_,
        r ? T(r.bill) : T('', SY.txt),
        r && has(r.amount) ? N_(num(r.amount)) : E_,
        r ? T(st(r)) : T('', SY.txt),
        r ? T(r.paidBy) : T('', SY.txt),
        F_(`IF(OR($D${n}="",$F${n}=""),"",$F${n}/$D${n})`, SY.dec2),
        r ? T(r.remark) : T('', SY.txt)
      ],
      {
        dv: [{ sq: `C3:C${dlL}`, f: `Masters!$E$3:$E$${mstL}` },
        { sq: `G3:G${dlL}`, f: '"Paid,Unpaid"' },
        { sq: `H3:H${dlL}`, f: `Masters!$G$3:$G$${mstL}` }]
      }));
  }

  /* ---------- Murum ---------- */
  if (m.murum) {
    const u = s.murumUnit || 'Brass';
    sheets.push(logSheet('Murum Log',
      ['Sr No', 'Date', 'Supplier', u, 'Rate / ' + u, 'Amount (Rs)', 'Status', 'Paid By', 'Trips', 'Remark'],
      [7, 13, 20, 10, 12, 14, 10, 13, 8, 24], mu,
      (r, n) => [
        F_(`IF($B${n}="","",COUNTA($B$3:$B${n}))`, SY.int),
        r ? D_(r.date) : E_,
        r ? T(r.vendor) : T('', SY.txt),
        r && has(r.qty) ? N_(num(r.qty), SY.dec2) : E_,
        r && has(r.rate) ? N_(num(r.rate)) : E_,
        (r && num(r.amount) && !(num(r.qty) && num(r.rate)))
          ? N_(mAmt(r))
          : F_(`IF(OR($D${n}="",$E${n}=""),"",$D${n}*$E${n})`),
        r ? T(st(r)) : T('', SY.txt),
        r ? T(r.paidBy) : T('', SY.txt),
        r && has(r.trips) ? N_(num(r.trips), SY.int) : E_,

      ],
      {
        dv: [{ sq: `C3:C${muL}`, f: `Masters!$C$3:$C$${mstL}` },
        { sq: `G3:G${muL}`, f: '"Paid,Unpaid"' },
        { sq: `H3:H${muL}`, f: `Masters!$G$3:$G$${mstL}` }]
      }));
  }

  /* ---------- Expense Log ---------- */
  const vpRef = m.vendor !== false;
  sheets.push(logSheet('Expense Log',
    ['Sr No', 'Date', 'Category', 'Description', 'Vendor', 'Amount (Rs)', 'Status', 'Paid By', 'Remark', 'Final Status', 'Settled By'],

      r ? T(r.remark) : T('', SY.txt),
      F_(`IF($B${n}="","",IF($G${n}="Paid","Paid",IF($E${n}="","Unpaid",IF(${vpRef ? `SUMIF('Vendor Payment'!$C$3:$C$${vpL},$E${n},'Vendor Payment'!$D$3:$D$${vpL})` : '0'}>=SUMIFS($F$3:$F${n},$E$3:$E${n},$E${n},$G$3:$G${n},"Unpaid"),"Paid","Unpaid"))))`, SY.txt),
      F_(`IF($J${n}="Paid",IF($G${n}="Paid",$H${n},"Vendor payment"),"")`, SY.txt)

    {
      dv: [{ sq: `C3:C${elL}`, f: `Masters!$A$3:$A$${mstL}` },
      { sq: `E3:E${elL}`, f: `Masters!$C$3:$C$${mstL}` },

  /* ---------- Vendor Payment ---------- */
  if (m.vendor !== false) {

        r ? D_(r.date) : E_,
        r ? T(r.vendor) : T('', SY.txt),
        r && has(r.amount) ? N_(num(r.amount)) : E_,
        r ? T(r.paidBy) : T('', SY.txt),
        r ? T(r.mode) : T('', SY.txt),
        r ? T(r.remark) : T('', SY.txt),
        F_(`IF($C${n}="","",SUMIF($C$3:$C${n},$C${n},$D$3:$D${n}))`)
      ],
      {
        dv: [{ sq: `C3:C${vpL}`, f: `Masters!$C$3:$C$${mstL}` },
        { sq: `E3:E${vpL}`, f: `Masters!$G$3:$G$${mstL}` }]
      }));
  }

  /* ---------- Owner Payment ---------- */
  if (m.owner) {
    sheets.push(logSheet('Owner Payment',
      ['Sr No', 'Date', 'Machine Owner', 'Amount (Rs)', 'Paid By', 'Mode', 'Remark'],
      [7, 13, 22, 14, 13, 14, 26], op,
      (r, n) => [
        F_(`IF($B${n}="","",COUNTA($B$3:$B${n}))`, SY.int),
        r ? D_(r.date) : E_, r ? T(r.owner) : T('', SY.txt),
        r && has(r.amount) ? N_(num(r.amount)) : E_,
        r ? T(r.paidBy) : T('', SY.txt), r ? T(r.mode) : T('', SY.txt), r ? T(r.remark) : T('', SY.txt)
      ],
      { dv: [{ sq: `E3:E${opL}`, f: `Masters!$G$3:$G$${mstL}` }] }));

  /* ---------- Paise Milale ---------- */
  if (m.funds) {

      ],
      { dv: [{ sq: `C3:C${fnL}`, f: `Masters!$G$3:$G$${mstL}` }] }));

  /* ---------- Machine Rent ---------- */
  if (m.machine !== false) {

    rows[0] = [T(s.name + '  \u2014  Machine Rent', SY.title)];

    sheets.push({ name: 'Machine Rent', freeze: 2, cols: [13, 12, 18, 11, 13, 8, 14, 14, 14], rows, merges: ['A1:I1'], heights: { 1: 26, 2: 28 } });

  if (m.machine !== false) {

  /* ---------- Manager Account ---------- */
  {

    const first = 3;
    s.people.forEach((p, i) => {

      const parts = [];
      if (m.funds) cells.push(F_(`SUMIF('Paise Milale'!$C$3:$C$${fnL},$A${n},'Paise Milale'!$D$3:$D$${fnL})`));
      cells.push(F_(`SUMIFS('Expense Log'!$F$3:$F$${elL},'Expense Log'!$H$3:$H$${elL},$A${n},'Expense Log'!$G$3:$G$${elL},"Paid")`)); parts.push('C');
      if (m.murum) { parts.push(colL(cells.length + 1)); cells.push(F_(`SUMIFS('Murum Log'!$F$3:$F$${muL},'Murum Log'!$H$3:$H$${muL},$A${n},'Murum Log'!$G$3:$G$${muL},"Paid")`)); }
      if (m.diesel !== false) { parts.push(colL(cells.length + 1)); cells.push(F_(`SUMIFS('Diesel Purchase'!$F$3:$F$${dlL},'Diesel Purchase'!$H$3:$H$${dlL},$A${n},'Diesel Purchase'!$G$3:$G$${dlL},"Paid")`)); }
      if (m.vendor !== false) { parts.push(colL(cells.length + 1)); cells.push(F_(`SUMIF('Vendor Payment'!$E$3:$E$${vpL},$A${n},'Vendor Payment'!$D$3:$D$${vpL})`)); }
      if (m.owner) { parts.push(colL(cells.length + 1)); cells.push(F_(`SUMIF('Owner Payment'!$E$3:$E$${opL},$A${n},'Owner Payment'!$D$3:$D$${opL})`)); }
      const expCol = colL(m.funds ? 3 : 2);
      const lastSpend = colL(cells.length);
      cells.push(F_(`SUM(${expCol}${n}:${lastSpend}${n})`, SY.tot));
      if (m.funds) {
        const totCol = colL(cells.length);
        const gotCol = 'B';
        cells.push((s.advance || []).includes(p) ? F_(`${gotCol}${n}-${totCol}${n}`, SY.tot) : T('—', SY.txt));
      }
      rows[n - 1] = cells;
    });
    const tr = s.people.length + first;
    rows[tr - 1] = head.map((h, i) => i === 0 ? T('TOTAL', SY.bold) : F_(`SUM(${colL(i + 1)}$${first}:${colL(i + 1)}$${tr - 1})`, SY.tot));
    rows[tr + 1] = [T('Shillak = paise milale \u2212 ekun kharch. Jyanna advance milat nahi tyanchya samor "—" asto.', SY.note)];
    sheets.push({ name: 'Manager Account', freeze: 2, cols: [18].concat(head.slice(1).map(() => 15)), rows, merges: ['A1:' + colL(head.length) + '1'], heights: { 1: 26, 2: 28 } });
  }

  /* ---------- Dashboard (pahili sheet) ---------- */
  {
    const rows = [];
    const W = 6;
    rows[0] = [T(s.name + '  \u2014  Site Dashboard', SY.title)];
    rows[1] = [T('Ha dashboard apoap update hoto. Khalchya sheets madhe entry kara.', SY.note)];

    const exp = `SUM('Expense Log'!$F$3:$F$${elL})`;
    const dsl = m.diesel !== false ? `SUM('Diesel Purchase'!$F$3:$F$${dlL})` : '0';
    const mur = m.murum ? `SUM('Murum Log'!$F$3:$F$${muL})` : '0';
    const rent = m.machine !== false ? `SUM('Machine Rent'!$I$3:$I$${mrL})` : '0';
    const vpay = m.vendor !== false ? `SUM('Vendor Payment'!$D$3:$D$${vpL})` : '0';
    const expP = `SUMIF('Expense Log'!$G$3:$G$${elL},"Paid",'Expense Log'!$F$3:$F$${elL})`;
    const expU = `SUMIF('Expense Log'!$G$3:$G$${elL},"Unpaid",'Expense Log'!$F$3:$F$${elL})`;
    const dslP = m.diesel !== false ? `SUMIF('Diesel Purchase'!$G$3:$G$${dlL},"Paid",'Diesel Purchase'!$F$3:$F$${dlL})` : '0';
    const dslU = m.diesel !== false ? `SUMIF('Diesel Purchase'!$G$3:$G$${dlL},"Unpaid",'Diesel Purchase'!$F$3:$F$${dlL})` : '0';
    const murP = m.murum ? `SUMIF('Murum Log'!$G$3:$G$${muL},"Paid",'Murum Log'!$F$3:$F$${muL})` : '0';
    const murU = m.murum ? `SUMIF('Murum Log'!$G$3:$G$${muL},"Unpaid",'Murum Log'!$F$3:$F$${muL})` : '0';

    rows[3] = [T('TOTAL PLOT EXPENSE', SY.kpiL), E_, T('PAID', SY.kpiL), E_, T('NET PENDING', SY.kpiL)];
    rows[4] = [F_(`${exp}+${dsl}+${mur}+${rent}`, SY.kpiV), E_, F_(`${expP}+${dslP}+${murP}+${vpay}`, SY.kpiV), E_, F_(`(${expU}+${dslU}+${murU})-${vpay}`, SY.kpiV)];

    rows[6] = [T('EXPENSE HEAD-WISE', SY.head), T('', SY.head), T('', SY.head), T('', SY.head)];
    rows[7] = ['Head', 'Total (Rs)', 'Paid (Rs)', 'Pending (Rs)'].map(c => T(c, SY.col));
    let r = 9;
    const line = (label, tot, paid, pend) => { rows[r - 1] = [T(label), F_(tot), F_(paid), F_(pend)]; r++; };
    line('Site Expense', exp, expP, expU);
    if (m.murum) line('Murum', mur, murP, murU);
    if (m.diesel !== false) line('Diesel Purchase', dsl, dslP, dslU);
    if (m.vendor !== false) line('Less: Vendor Payments', '0', vpay, `-${vpay}`);
    rows[r - 1] = [T('NET (rent sodun)', SY.bold), F_(`SUM($B$9:$B$${r - 1})`, SY.tot), F_(`SUM($C$9:$C$${r - 1})`, SY.tot), F_(`SUM($D$9:$D$${r - 1})`, SY.tot)];
    r += 2;

    if (m.machine !== false) {
      const opSum = m.owner ? `SUM('Owner Payment'!$D$3:$D$${opL})` : '0';
      rows[r - 1] = [T('MACHINE RENT', SY.head), T('', SY.head), T('', SY.head), T('', SY.head)]; r++;
      rows[r - 1] = ['Rent payable (Rs)', 'Owner la dilele (Rs)', 'Baki (Rs)', ''].map(c => T(c, SY.col)); r++;
      rows[r - 1] = [F_(rent), F_(opSum), F_(`${rent}-${opSum}`, SY.tot)]; r += 2;
    }

    rows[r - 1] = [T('CATEGORY-WISE SITE EXPENSE', SY.head), T('', SY.head), T('', SY.head), T('', SY.head)]; r++;
    rows[r - 1] = ['Category', 'Total (Rs)', 'Paid (Rs)', 'Entries'].map(c => T(c, SY.col)); r++;
    const catStart = r;
    s.categories.forEach(c => {
      const n = r;
      rows[n - 1] = [T(c),
        F_(`SUMIF('Expense Log'!$C$3:$C$${elL},$A${n},'Expense Log'!$F$3:$F$${elL})`),
        F_(`SUMIFS('Expense Log'!$F$3:$F$${elL},'Expense Log'!$C$3:$C$${elL},$A${n},'Expense Log'!$G$3:$G$${elL},"Paid")`),
        F_(`COUNTIF('Expense Log'!$C$3:$C$${elL},$A${n})`, SY.int)];
      r++;
    });
    rows[r - 1] = [T('TOTAL', SY.bold), F_(`SUM($B$${catStart}:$B$${r - 1})`, SY.tot), F_(`SUM($C$${catStart}:$C$${r - 1})`, SY.tot), F_(`SUM($D$${catStart}:$D$${r - 1})`, SY.tot)];
    r += 2;

    if (m.vendor !== false) {
      rows[r - 1] = [T('VENDOR-WISE UDHAARI', SY.head), T('', SY.head), T('', SY.head), T('', SY.head), T('', SY.head)]; r++;
      rows[r - 1] = ['Vendor', 'Ekun kaam (Rs)', 'Direct paid (Rs)', 'Payment kele (Rs)', 'Baki (Rs)'].map(c => T(c, SY.col)); r++;
      const vs = r;
      s.vendors.forEach(v => {
        const n = r;
        const totF = `SUMIF('Expense Log'!$E$3:$E$${elL},$A${n},'Expense Log'!$F$3:$F$${elL})` + (m.murum ? `+SUMIF('Murum Log'!$C$3:$C$${muL},$A${n},'Murum Log'!$F$3:$F$${muL})` : '');
        const dirF = `SUMIFS('Expense Log'!$F$3:$F$${elL},'Expense Log'!$E$3:$E$${elL},$A${n},'Expense Log'!$G$3:$G$${elL},"Paid")` + (m.murum ? `+SUMIFS('Murum Log'!$F$3:$F$${muL},'Murum Log'!$C$3:$C$${muL},$A${n},'Murum Log'!$G$3:$G$${muL},"Paid")` : '');
        rows[n - 1] = [T(v), F_(totF), F_(dirF),
          F_(`SUMIF('Vendor Payment'!$C$3:$C$${vpL},$A${n},'Vendor Payment'!$D$3:$D$${vpL})`),
          F_(`$B${n}-$C${n}-$D${n}`, SY.tot)];
        r++;
      });
      rows[r - 1] = [T('TOTAL', SY.bold), F_(`SUM($B$${vs}:$B$${r - 1})`, SY.tot), F_(`SUM($C$${vs}:$C$${r - 1})`, SY.tot), F_(`SUM($D$${vs}:$D$${r - 1})`, SY.tot), F_(`SUM($E$${vs}:$E$${r - 1})`, SY.tot)];
      r += 2;
    }

    if (m.diesel !== false) {
      rows[r - 1] = [T('DIESEL VENDOR-WISE', SY.head), T('', SY.head), T('', SY.head), T('', SY.head)]; r++;
      rows[r - 1] = ['Diesel Vendor', 'Litres', 'Amount (Rs)', 'Unpaid (Rs)'].map(c => T(c, SY.col)); r++;
      s.dieselVendors.forEach(v => {
        const n = r;
        rows[n - 1] = [T(v),
          F_(`SUMIF('Diesel Purchase'!$C$3:$C$${dlL},$A${n},'Diesel Purchase'!$D$3:$D$${dlL})`, SY.dec1),
          F_(`SUMIF('Diesel Purchase'!$C$3:$C$${dlL},$A${n},'Diesel Purchase'!$F$3:$F$${dlL})`),
          F_(`SUMIFS('Diesel Purchase'!$F$3:$F$${dlL},'Diesel Purchase'!$C$3:$C$${dlL},$A${n},'Diesel Purchase'!$G$3:$G$${dlL},"Unpaid")`)];
        r++;
      });
      r += 1;
    }

    if (m.machine !== false) {
      rows[r - 1] = [T('MACHINE SUMMARY', SY.head), T('', SY.head), T('', SY.head), T('', SY.head)]; r++;
      rows[r - 1] = ['Total machines', 'Log entries', 'Total hours', 'Diesel used (L)'].map(c => T(c, SY.col)); r++;
      rows[r - 1] = [F_(`COUNTA('Machine Master'!$B$3:$B$${mmL})`, SY.int),
        F_(`COUNTA('Machine Log'!$C$3:$C$${mlL})`, SY.int),
        F_(`SUM('Machine Log'!$G$3:$G$${mlL})`, SY.dec1),
        F_(`SUM('Machine Log'!$H$3:$H$${mlL})`, SY.dec1)];
      r += 2;
    }

    sheets.unshift({ name: 'Dashboard', tabSelected: true, cols: [30, 18, 18, 18, 18, 14], rows, merges: ['A1:F1', 'A2:F2', 'A4:B4', 'A5:B5', 'C4:D4', 'C5:D5'], heights: { 1: 30, 5: 24 } });
  }

  return sheets;
}

function xlsxBytes(s) {
  const sheets = buildWorkbook(s);
  const files = [];
  const ct = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">',
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>',
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>',
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'];
  sheets.forEach((sh, i) => ct.push(`<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`));
  ct.push('</Types>');
  files.push({ name: '[Content_Types].xml', data: ENC.encode(ct.join('')) });
  files.push({ name: '_rels/.rels', data: ENC.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>') });
  const wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
    sheets.map((sh, i) => `<sheet name="${X(sh.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') +
    '</sheets><calcPr calcId="171027" fullCalcOnLoad="1"/></workbook>';
  files.push({ name: 'xl/workbook.xml', data: ENC.encode(wb) });
  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    sheets.map((sh, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
    `<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  files.push({ name: 'xl/_rels/workbook.xml.rels', data: ENC.encode(rels) });
  files.push({ name: 'xl/styles.xml', data: ENC.encode(STYLES_XML) });
  sheets.forEach((sh, i) => files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, data: ENC.encode(sheetXml(sh)) }));
  return zipStore(files);
}

function exportExcel(s) {
  try {
    const bytes = xlsxBytes(s);
    const name = s.name.replace(/[^\w]+/g, '_') + '_Account_' + today() + '.xlsx';
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
    toast('Excel file download zali');
  } catch (e) { console.error(e); toast('Excel banavtana problem ala'); }
}

let SHEET = null;

function openSheet(title, body, onSave, onDelete) {
  SHEET = { onSave, onDelete };
  $('#modal').innerHTML = `<div class="sheet" data-act="sheetBg"><div class="box">
    <h3>${title}<button class="x" data-act="sheetClose">&times;</button></h3>
    ${body}
    <div class="btnrow" style="margin-top:14px"><button class="btn" data-act="sheetSave">Save</button></div>
    ${onDelete ? '<div class="btnrow"><button class="btn dgr sm" style="flex:1" data-act="sheetDelete">Delete kara</button></div>' : ''}
  </div></div>`;
  document.body.style.overflow = 'hidden';
}
function closeSheet() { $('#modal').innerHTML = ''; SHEET = null; document.body.style.overflow = ''; }
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; }
const numVal = id => { const v = val(id); return v === '' ? '' : num(v); }

function selOpts(list, cur, blank) {
  return (blank ? `<option value="">${blank}</option>` : '') +
    list.map(v => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join('') +
    (cur && !list.includes(cur) ? `<option selected>${esc(cur)}</option>` : '');
}
function segField(label, id, opts, cur, cls) {
  return `<div class="field"><label>${label}</label><div class="seg ${cls || ''}" id="${id}">${opts.map(o => `<button type="button" data-seg="${id}" data-v="${o}" class="${cur === o ? 'on' : ''}">${o}</button>`).join('')}</div></div>`;
}
const segVal = id => { const e = document.querySelector('#' + id + ' button.on'); return e ? e.dataset.v : ''; }

      if (rec) Object.assign(rec, o); else s.machineLog.push({ id: uid(), ...o });

/* ---------- simple lists ---------- */
function listForm(s, key, idx) {
  const cur = idx == null ? '' : s[key][idx];
  const titles = { categories: 'Category', people: 'Naav', vendors: 'Vendor', dieselVendors: 'Diesel Vendor' };
  openSheet((idx == null ? 'Navin ' : 'Badla ') + titles[key], `

    () => {

        if (old !== v) {
          if (key === 'categories') s.expenseLog.forEach(e => { if (e.category === old) e.category = v; });
          if (key === 'vendors') { s.expenseLog.forEach(e => { if (e.vendor === old) e.vendor = v; }); s.vendorPayments.forEach(p => { if (p.vendor === old) p.vendor = v; }); }
          if (key === 'dieselVendors') s.dieselLog.forEach(d => { if (d.vendor === old) d.vendor = v; });
          if (key === 'people') { [s.expenseLog, s.dieselLog].forEach(l => l.forEach(r => { if (r.paidBy === old) r.paidBy = v; })); s.vendorPayments.forEach(p => { if (p.paidBy === old) p.paidBy = v; }); }

      }
      return true;
    },
    idx == null ? null : () => { s[key].splice(idx, 1); });
}

const STD_CATS = ['Murum', 'Road work', 'Machine / JCB', 'Compound wall', 'Steel material', 'Construction material', 'Fabrication / Hardware', 'Electrical work', 'Plumbing material', 'Site workers / Labour', 'Driver bhatta', 'Transport', 'Food / Tea', 'Fuel (other)', 'Plot marking - Survey', 'Borewell', 'Office expense', 'Miscellaneous'];
const TYPE_PREFIX = { Poclain: 'PC', JCB: 'JCB', Hiwa: 'HW', Tractor: 'TR', Bulldozer: 'BD', Roller: 'RL' };
const MODS = [
  ['machine', 'Machine log ani rent'],
  ['diesel', 'Diesel purchase'],
  ['murum', 'Murum (vegla hishob)'],
  ['vendor', 'Vendor udhaari ani payment'],
  ['owner', 'Machine owner payment'],
  ['funds', 'Paise milale / shillak']
];
const togs = () => {
  const o = {};
  document.querySelectorAll('[data-tog]').forEach(b => { o[b.dataset.tog] = b.classList.contains('on'); });
  return o;
};
const togChip = (k, label, on) => `<button type="button" class="chip ${on ? 'on' : ''}" data-tog="${k}">${label}</button>`;

  openSheet(s ? 'Site setup' : 'Navin site', `

      <div class="pad tiny">Nantar pn ithun badalta yeil. Band kelela module cha data delete hot nahi, fakt lapto.</div>

    ${s ? '' : `<div class="card"><h3>Machines<small>kiti aahet te taka</small></h3><div class="pad">

      <div class="chips" style="flex-wrap:wrap;overflow:visible">${STD_CATS.map(c => togChip('cat.' + c, c, ['Murum', 'Machine / JCB', 'Site workers / Labour', 'Food / Tea', 'Transport', 'Miscellaneous'].includes(c))).join('')}</div>
    </div>`}

    <div class="card"><h3>Naav<small>kharch konachya naavane</small></h3>
      <div class="chips" style="flex-wrap:wrap;overflow:visible">${allPeople.map(p => togChip('per.' + p, p, s ? (s.people || []).includes(p) : true)).join('') || '<span class="muted">Nantar Masters madhun add kara.</span>'}</div>
