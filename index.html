    </div>`,
    () => {
      const name = val('f_name'); if (!name) return toast('Naav taka');
      const T = togs();
      const mset = {}; MODS.forEach(([k]) => mset[k] = !!T['mod.' + k]);
      const people = [], adv = [];
      Object.keys(T).forEach(k => { if (k.startsWith('per.') && T[k]) people.push(k.slice(4)); if (k.startsWith('adv.') && T[k]) adv.push(k.slice(4)); });
      if (s) {
        s.name = name; s.mods = mset;
        if (people.length) s.people = [...new Set(s.people.filter(p => people.includes(p)).concat(people))];
        s.advance = adv.filter(p => s.people.includes(p));
      } else {
        const ns = blankSite(name);
        ns.mods = mset;
        const src = DB.sites.find(x => x.id === val('f_copy'));
        if (src) {
          ns.rateMaster = JSON.parse(JSON.stringify(src.rateMaster));
          ns.machines = src.machines.map(m => ({ ...m, id: uid() }));
          ns.categories = src.categories.slice(); ns.vendors = src.vendors.slice(); ns.dieselVendors = src.dieselVendors.slice();
        }
        const cats = [];
        Object.keys(T).forEach(k => { if (k.startsWith('cat.') && T[k]) cats.push(k.slice(4)); });
        if (cats.length) ns.categories = [...new Set(ns.categories.concat(cats).filter(c => c !== 'Miscellaneous'))].concat('Miscellaneous');
        ns.rateMaster.forEach(rm => {
          const cnt = num(val('qc_' + rm.type)), rate = num(val('qr_' + rm.type));
          if (rate) rm.packageRate = rate;
          const px = TYPE_PREFIX[rm.type] || rm.type.slice(0, 2).toUpperCase();
          for (let i = 1; i <= cnt; i++) ns.machines.push({ id: uid(), no: px + '-' + String(i).padStart(2, '0'), type: rm.type, owner: '', operator: '', make: '', monthlyRate: '' });
        });
        ns.people = people.length ? people : [];
        ns.advance = adv.filter(p => ns.people.includes(p));
        DB.sites.push(ns); DB.activeId = ns.id; TAB = 'dash'; UI = {};
      }
      return true;
    },
    s && DB.sites.length > 1 ? () => {
      if (!confirm('"' + s.name + '" cha sagla data delete hoil. Nakki?')) return false;
      DB.sites = DB.sites.filter(x => x.id !== s.id);
      if (DB.activeId === s.id) DB.activeId = DB.sites[0].id;
    } : null);
}

function dayRegister(s, d) {
  const day = d || today();
  const exp = s.expenseLog.filter(e => e.date === day);
  const mu = (s.murumLog || []).filter(r => r.date === day);
  const ds = s.dieselLog.filter(r => r.date === day);
  const vp = s.vendorPayments.filter(r => r.date === day);
  const got = (s.funds || []).filter(r => r.date === day);
  const spentTill = k => k;
  const before = (arr, amtFn) => arr.filter(r => r.date && r.date < day).reduce((a, r) => a + amtFn(r), 0);
  const prevIn = before(s.funds || [], r => num(r.amount));
  const prevOut = before(s.expenseLog.filter(e => st(e) === 'Paid'), r => num(r.amount))
    + before((s.murumLog || []).filter(r => st(r) === 'Paid'), mAmt)
    + before(s.dieselLog.filter(r => st(r) === 'Paid'), r => num(r.amount))
    + before(s.vendorPayments, r => num(r.amount)) + before(s.ownerPayments || [], r => num(r.amount));
  const dayOut = exp.filter(e => st(e) === 'Paid').reduce((a, r) => a + num(r.amount), 0)
    + mu.filter(r => st(r) === 'Paid').reduce((a, r) => a + mAmt(r), 0)
    + ds.filter(r => st(r) === 'Paid').reduce((a, r) => a + num(r.amount), 0)
    + vp.reduce((a, r) => a + num(r.amount), 0);
  const dayIn = got.reduce((a, r) => a + num(r.amount), 0);
  const L = [];
  L.push('*' + s.name + '*');
  L.push(fmtDate(day));
  if (s.mods.funds) { L.push(''); L.push('Previous Balance : ' + money(prevIn - prevOut)); L.push('Received Amount : ' + money(dayIn)); }
  L.push('');
  exp.forEach(e => L.push((e.desc || e.category) + ' - ' + money(e.amount) + (st(e) === 'Unpaid' ? ' (udhaar)' : '')));
  mu.forEach(r => L.push('Murum ' + dec(r.qty) + ' ' + (s.murumUnit || 'Brass') + ' - ' + money(mAmt(r)) + (st(r) === 'Unpaid' ? ' (udhaar)' : '')));
  ds.forEach(r => L.push('Diesel ' + dec(r.litres) + ' L (' + r.vendor + ') - ' + money(r.amount) + (st(r) === 'Unpaid' ? ' (udhaar)' : '')));
  vp.forEach(r => L.push(r.vendor + ' payment - ' + money(r.amount)));
  if (!exp.length && !mu.length && !ds.length && !vp.length) L.push('(ya divshi kharch nahi)');
  L.push('');
  L.push('*Total Expense : ' + money(dayOut) + '*');
  if (s.mods.funds) L.push('*Remaining Amount : ' + money(prevIn - prevOut + dayIn - dayOut) + '*');
  return L.join('\n');
}

function dayRegisterSheet(s) {
  const d = UI.regDate || today();
  openSheet('Divas cha hishob', `
    <div class="card"><div class="pad">
      <div class="field"><label>Date</label><input type="date" id="f_d" value="${d}" data-act="regDate"></div>
      <textarea id="f_blk" rows="12" style="width:100%;font-size:13px;padding:10px;border:1px solid var(--line);border-radius:8px">${esc(dayRegister(s, d))}</textarea>
      <div class="btnrow" style="margin-top:8px">
        <button class="btn sm" style="flex:1" data-act="xlClip">Copy</button>
        <button class="btn sec sm" style="flex:1" data-act="waSend">WhatsApp</button>
      </div>
    </div></div>`, null, null);
  const inp = document.getElementById('f_d');
  inp.addEventListener('change', e => { UI.regDate = e.target.value; document.getElementById('f_blk').value = dayRegister(s, e.target.value); });
}

/* ---------- juna sheet madhe paste karayche rows ---------- */
function xlCopySheet(s, k) {
  const x = XL[k], rows = pending(s, k), start = num(s.xlRows[k]) || x.first;
  if (!rows.length) return toast('Ithe kahi navin nahi');
  const text = xlBlock(s, k, start);
  const end = start + rows.length - 1;
  openSheet(x.sheet + ' &rarr; juna Excel', `
    <div class="card"><div class="pad">
      <div class="tiny" style="margin-bottom:8px"><b>${rows.length}</b> rows. Juna file madhe <b>${esc(x.sheet)}</b> sheet ughada, cell <b>B${start}</b> var jaa ani paste kara (rows ${start}&ndash;${end}, columns ${x.cols}).</div>
      <textarea id="f_blk" rows="7" style="width:100%;font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:8px;border:1px solid var(--line);border-radius:8px">${esc(text)}</textarea>
      <div class="btnrow" style="margin-top:8px"><button class="btn sm" style="flex:1" data-act="xlClip">Copy</button></div>
    </div></div>`,
    () => { markDone(s, k, rows.length); return true; }, null);
  const btn = document.querySelector('[data-act="sheetSave"]');
  if (btn) btn.textContent = 'Paste zala - mark kara';
  const box = document.getElementById('f_blk');
  if (box) { try { box.focus(); box.setSelectionRange(0, box.value.length); } catch (e) { } }
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Copy zala'), () => { });
}

function markDone(s, k, n) {
  const rows = pending(s, k);
  rows.forEach(r => r.xl = true);
  s.xlRows[k] = (num(s.xlRows[k]) || XL[k].first) + (n != null ? n : rows.length);
}

/* ---------- share / export ---------- */
function shareText() {
  const s = site(), t = totals(s);
  const L = [];
  L.push('*' + s.name.toUpperCase() + '*');
  L.push(fmtDate(today()));
  L.push('');
  L.push('Total plot expense: ' + money(t.grand));
  L.push('  Site expense: ' + money(t.expTotal));
  L.push('  Diesel: ' + money(t.dsTotal));
  L.push('  Machine rent: ' + money(t.rent));
  L.push('');
  L.push('Paid: ' + money(t.expPaidDirect + t.dsPaid + t.vendorPaid));
  L.push('*Net pending: ' + money(t.netPending) + '*');
  L.push('');
  L.push('Manager-wise:');
  s.people.forEach(p => { const x = personStats(s, p); if (x.total) L.push('  ' + p + ': ' + money(x.total)); });
  const pend = s.vendors.map(v => ({ v, x: vendorStats(s, v) })).filter(o => o.x.remaining > 0);
  if (pend.length) { L.push(''); L.push('Vendor baki:'); pend.forEach(o => L.push('  ' + o.v + ': ' + money(o.x.remaining))); }
  return L.join('\n');
}

function download(name, text, type) {
  const b = new Blob([text], { type: type || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const csvCell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
function exportCsv(kind) {
  const s = site(); const fin = settle(s); let head = [], rows = [];
  if (kind === 'expense') {
    head = ['Date', 'Category', 'Description', 'Vendor', 'Amount', 'Payment Status', 'Paid By', 'Final Status', 'Settled By', 'Remark'];
    rows = s.expenseLog.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).map(e => [e.date, e.category, e.desc, e.vendor, e.amount, e.status, e.paidBy, fin[e.id].final, fin[e.id].by, e.remark]);
  } else if (kind === 'machine') {
    head = ['Date', 'Machine No', 'Machine Type', 'In Reading', 'Out Reading', 'Total Hr', 'Diesel Filled (L)', 'Remark'];
    rows = s.machineLog.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).map(r => [r.date, r.machineNo, machineType(s, r.machineNo), r.inR, r.outR, hoursOf(r), r.diesel, r.remark]);
  } else {
    head = ['Date', 'Vendor', 'Diesel (L)', 'Bill No', 'Amount', 'Payment Status', 'Paid By', 'Remark'];
    rows = s.dieselLog.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).map(d => [d.date, d.vendor, d.litres, d.bill, d.amount, d.status, d.paidBy, d.remark]);
  }
  const csv = '\uFEFF' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
  download(s.name.replace(/[^\w]+/g, '_') + '_' + kind + '_' + today() + '.csv', csv, 'text/csv;charset=utf-8');
  toast('CSV download zala');
}

function importJson() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = async () => {
      try {
        const d = JSON.parse(rd.result);
        if (!d.sites || !Array.isArray(d.sites)) throw 0;
        if (!confirm('Ya file madhlya ' + d.sites.length + ' sites import honar. Aatacha sagla data ya file madhlya data ne badalel. Pudhe jaayche?')) return;
        DB = d; if (!DB.sites.find(x => x.id === DB.activeId)) DB.activeId = DB.sites[0].id;
        await save(); render(); toast('Import zala');
      } catch (e) { alert('Hi file vachta ali nahi. Ya app madhun download kelelich backup file nivda.'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', async e => {
  const tg = e.target.closest('[data-tog]');
  if (tg) { tg.classList.toggle('on'); return; }
  const seg = e.target.closest('[data-seg]');
  if (seg) { document.querySelectorAll('#' + seg.dataset.seg + ' button').forEach(b => b.classList.remove('on')); seg.classList.add('on'); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, s = site();

  if (a === 'sheetBg' && e.target !== el) return;
  if (a === 'sheetBg' || a === 'sheetClose') return closeSheet();
  if (a === 'sheetSave') {
    if (SHEET && SHEET.onSave) { const ok = SHEET.onSave(); if (ok === false || ok === undefined && false) return; if (ok !== true) return; }
    closeSheet(); await save(); render(); toast('Save zala'); return;
  }
  if (a === 'sheetDelete') {
    if (SHEET && SHEET.onDelete) { if (SHEET.onDelete() === false) return; }
    closeSheet(); await save(); render(); toast('Delete zala'); return;
  }

  switch (a) {
    case 'tab': TAB = v; render(); break;
    case 'sub': UI[el.dataset.t || TAB] = v; if (el.dataset.t) TAB = el.dataset.t; render(); break;
    case 'mlFilter': UI.mlFilter = v; UI.mlMore = 60; render(); break;
    case 'mlMore': UI.mlMore = (UI.mlMore || 60) + 100; render(); break;
    case 'dlMore': UI.dlMore = (UI.dlMore || 50) + 100; render(); break;
    case 'exCat': UI.exCat = v; UI.exMore = 50; render(); break;
    case 'exMore': UI.exMore = (UI.exMore || 50) + 100; render(); break;
    case 'person': UI.person = v; render(); break;
    case 'mlAdd': machineForm(s); break;
    case 'mlEdit': machineForm(s, s.machineLog.find(x => x.id === v)); break;
    case 'dAdd': dieselForm(s); break;
    case 'dEdit': dieselForm(s, s.dieselLog.find(x => x.id === v)); break;
    case 'eAdd': expenseForm(s); break;
    case 'eEdit': expenseForm(s, s.expenseLog.find(x => x.id === v)); break;
    case 'vpAdd': vpForm(s, null, v); break;
    case 'vpEdit': vpForm(s, s.vendorPayments.find(x => x.id === v)); break;
    case 'muAdd': murumForm(s); break;
    case 'muEdit': murumForm(s, s.murumLog.find(x => x.id === v)); break;
    case 'muMore': UI.muMore = (UI.muMore || 50) + 100; render(); break;
    case 'fnAdd': fundsForm(s); break;
    case 'fnEdit': fundsForm(s, s.funds.find(x => x.id === v)); break;
    case 'opAdd': ownerPayForm(s); break;
    case 'opEdit': ownerPayForm(s, s.ownerPayments.find(x => x.id === v)); break;
    case 'dayReg': dayRegisterSheet(s); break;
    case 'waSend': window.open('https://wa.me/?text=' + encodeURIComponent(document.getElementById('f_blk').value), '_blank'); break;
    case 'mAdd': machineMasterForm(s); break;
    case 'mEdit': machineMasterForm(s, s.machines.find(x => x.id === v)); break;
    case 'rmEdit': rateForm(s, +v); break;
    case 'listAdd': listForm(s, v, null); break;
    case 'listEdit': { const [k, i] = v.split(':'); listForm(s, k, +i); break; }
    case 'sites': sitePicker(); break;
    case 'siteAdd': closeSheet(); siteForm(null); break;
    case 'siteEdit': siteForm(v); break;
    case 'siteGo': DB.activeId = v; UI = {}; TAB = 'dash'; closeSheet(); await save(); render(); toast('Site badalli'); break;
    case 'xlsx': exportExcel(s); break;
    case 'xlRow': break;
    case 'xlCopy': xlCopySheet(s, el.dataset.k); break;
    case 'xlClip': {
      const box = document.getElementById('f_blk');
      box.focus(); box.setSelectionRange(0, box.value.length);
      try { await navigator.clipboard.writeText(box.value); toast('Copy zala'); }
      catch (err) { try { document.execCommand('copy'); toast('Copy zala'); } catch (e2) { toast('Text select zala aahe - long press karun copy kara'); } }
      break;
    }
    case 'xlFile': {
      const k = el.dataset.k, x = XL[k], start = num(s.xlRows[k]) || x.first;
      download(x.sheet.replace(/ /g, '_') + '_row' + start + '.csv',
        '\uFEFF' + xlBlock(s, k, start).split('\n').map(l => l.split('\t').map(csvCell).join(',')).join('\r\n'),
        'text/csv;charset=utf-8');
      toast('File download zali');
      break;
    }
    case 'xlAllDone':
      if (!confirm('Saglya navin entries Excel madhe add zalya asa mark karaycha?')) break;
      Object.keys(XL).forEach(k => markDone(s, k));
      await save(); render(); toast('Mark zala');
      break;
    case 'xlReset':
      if (!confirm('Saglya entries parat "Excel madhe gelelya nahit" asa mark hotil. Pudhe jaayche?')) break;
      Object.keys(XL).forEach(k => { s[k].forEach(r => { delete r.xl; }); s.xlRows[k] = XL[k].first; });
      await save(); render(); toast('Reset zala');
      break;
    case 'snapList': UI.snaps = await Store.snapshots(); render(); break;
    case 'snapBack': {
      const raw = await Store.snapshotGet(v);
      if (!raw) { toast('Ha snapshot sapadla nahi'); break; }
      if (!confirm(fmtDate(v.slice(5)) + ' cha data parat aanaycha? Aatacha data tya divsachya data ne badalel.')) break;
      DB = JSON.parse(raw); migrate();
      if (!DB.sites.find(x => x.id === DB.activeId)) DB.activeId = DB.sites[0].id;
      await save(); UI = {}; render(); toast('Parat aanla');
      break;
    }
    case 'expJson': download('site-manager-backup-' + today() + '.json', JSON.stringify(DB), 'application/json'); toast('Backup download zala'); break;
    case 'impJson': importJson(); break;
    case 'expCsv': exportCsv(v); break;
    case 'share': {
      const txt = shareText();
      try { await navigator.clipboard.writeText(txt); toast('Summary copy zala'); } catch (err) { }
      window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
      break;
    }
  }
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'xlRow') { const s = site(); s.xlRows[el.dataset.k] = num(el.value) || XL[el.dataset.k].first; save(); render(); }
  if (a === 'rentMachine') { UI.rentMachine = el.value; render(); }
  if (a === 'rentFrom') { UI.rentFrom = el.value; render(); }
  if (a === 'rentTo') { UI.rentTo = el.value; render(); }
});

/* ---------- go ---------- */
(async () => { await load(); render(); })();

</script>
